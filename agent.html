<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThinkOS Reseller Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an operations console. A fixed identity bar, a scrollable tab rail, then
   one working column of panels; state is carried by pills and stripes, numbers in mono. */
:root{
  --bg:#F3F7F2; --surface:#ffffff; --sunk:#EEF6EB; --ink:#13241B; --muted:#55655B; --line:#D5E2D8;
  --accent:#205C40; --accent-ink:#ffffff; --accent-soft:#E3F1DF;
  --good:#1d7a46; --warn:#9a5b00; --crit:#b3261e; --warn-soft:#fbefd9; --crit-soft:#fbe6e4; --good-soft:#e1f3e7;
  --display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1510; --surface:#0F1E17; --sunk:#13281E; --ink:#E6F1EA; --muted:#A3B5A9; --line:#21382C;
    --accent:#5BCB3F; --accent-ink:#0A1510; --accent-soft:#16301F;
    --good:#5fcf8d; --warn:#e6ad4f; --crit:#f08a80; --warn-soft:#3a2d12; --crit-soft:#3d1c19; --good-soft:#14301f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1510; --surface:#0F1E17; --sunk:#13281E; --ink:#E6F1EA; --muted:#A3B5A9; --line:#21382C;
  --accent:#5BCB3F; --accent-ink:#0A1510; --accent-soft:#16301F;
  --good:#5fcf8d; --warn:#e6ad4f; --crit:#f08a80; --warn-soft:#3a2d12; --crit-soft:#3d1c19; --good-soft:#14301f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:20px} h3{font-size:15px;letter-spacing:.01em}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.mark{width:22px;height:22px;border-radius:5px;background:var(--accent);display:inline-block;position:relative}
.mark::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:3px;background:var(--accent-ink);box-shadow:0 5px 0 var(--accent-ink)}
.grow{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px}
textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:13px;resize:vertical}
nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{max-width:1040px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
.tabs a{padding:11px 10px;text-decoration:none;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.notice{max-width:1040px;margin:12px auto 0;padding:0 16px}
.notice div{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:8px 12px;border-radius:4px;font-size:13px}
main{max-width:1040px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel > .head{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.panel{min-width:0}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tile{background:var(--sunk);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--mono);font-size:22px;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item.warn{border-left-color:var(--warn)} .item.crit{border-left-color:var(--crit)} .item.good{border-left-color:var(--good)} .item.acc{border-left-color:var(--accent)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.steps span.now{background:var(--accent);color:var(--accent-ink)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.plan li.done .tick{background:var(--accent);border-color:var(--accent)}
.plan li.now .tick{border-color:var(--accent)}
.who{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.who.claude{background:var(--accent-soft);color:var(--accent)} .who.jev{background:var(--warn-soft);color:var(--warn)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:90px;flex:1}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--warn)}
.log{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.log div{display:flex;gap:8px;align-items:baseline;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
.log time{font-family:var(--mono);color:var(--muted);flex:none}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{padding:8px 12px;border-radius:8px;background:var(--sunk);white-space:pre-wrap;max-width:65ch}
.bubble.me{background:var(--accent-soft);align-self:flex-end}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:90vw}
.total{font-family:var(--mono);font-size:16px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.plan li.now .tick{animation:pulse 1s infinite} @keyframes pulse{50%{opacity:.35}}}
</style>
</head>

"use strict";

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

/* ---------- reference data ---------- */
const TERR = {
  AU:{name:"Australia",cur:"AUD",locale:"en-AU",tax:"GST",rate:0.10,level:2,unlock:10,live:"February 2027"},
  NZ:{name:"New Zealand",cur:"NZD",locale:"en-NZ",tax:"GST",rate:null,level:2,unlock:10,live:"To be set"},

/* ---------- state ---------- */
const S = {

    {rid:"premier",name:"Marina Quay Apartments",bins:96,locks:48,sensors:20,plan:"Operations"},

    {rid:"premier",name:"Harvest Lane Markets",bins:58,locks:20,sensors:0,plan:"Bin Map"}
  ],

    lock:{name:"GravityLock",onHand:1240,reserved:55,incoming:2000,eta:day(38),weekly:140},

  ],

    {id:"T-1042",rid:"solo",client:"Bayview Retail Park",locks:30,sensors:10,total:6059.90,status:3,by:"Reseller",t:day(-5)},
    {id:"T-1043",rid:"solo",client:"Cedar Grove Aged Care",locks:25,sensors:0,total:3685.00,status:2,by:"Reseller",t:day(-2)},

};
const SAMPLE_LIST = `Client: Sandalwood Shopping Village
Loading dock: 24 bins, 24 locks, 12 sensors
Food court back-of-house: 16 bins (8 organics), locks on all, 8 sensors
North car park: 10 bins, 10 locks
Tenant corridor B: 6 bins`;

const R = () => S.resellers[S.rid];
const T = () => TERR[R().terr];
const money = n => new Intl.NumberFormat(T().locale, {style:"currency",currency:T().cur}).format(n);
const avail = k => S.stock[k].onHand - S.stock[k].reserved;
function log(who, text, p){ S.log.unshift({t:new Date(), who, text, p}); }
function tierOf(n){ let i = 0; TIERS.forEach((t, k) => { if (n >= t.from) i = k; }); return i; }

/* ---------- Claude (optional) ---------- */
let sample = null;
(async () => {
  try { if (CL && CL.use) { sample = await CL.use("sample"); if (sample) render(); } } catch (e) { sample = null; }
})();

/* ---------- site list reading ---------- */
function parseLocal(text){
  const out = {client:"", sites:[], assumptions:[]};
  text.split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const c = line.match(/^client\s*[:\-]\s*(.+)$/i);
    if (c) { out.client = c[1].trim(); return; }
    const name = (line.split(/:|\s[\u2013-]\s/)[0] || "").trim();
    const bins = +(line.match(/(\d+)\s*bins?/i) || [])[1] || 0;
    let locks = line.match(/(\d+)\s*(?:gravity\s*)?locks?/i); locks = locks ? +locks[1] : null;
    const sensors = +(line.match(/(\d+)\s*sensors?/i) || [])[1] || 0;
    if (!bins && locks == null && !sensors) return;
    if (locks == null) {
      locks = bins;
      if (!/locks?\s+on\s+all/i.test(line)) out.assumptions.push(`${name}: no lock count given, so one lock per bin was assumed.`);
    }
    out.sites.push({name: name || "Site " + (out.sites.length + 1), bins: bins || locks, locks, sensors});
  });
  return out;
}
async function readList(text){
  if (sample) {
    try {
      const prompt = `You read a waste-bin site list for a smart bin lock and fill sensor order. Extract it as JSON only, with this shape:
{"client": string, "sites": [{"name": string, "bins": integer, "locks": integer, "sensors": integer}], "assumptions": [string]}
Rules: one entry per site or area. If a site gives no lock count, set locks equal to its bins and add an assumption sentence naming the site. If it gives no sensor count, set sensors to 0. "Locks on all" means locks equal bins and needs no assumption. If no client name is given use "". Do not invent sites.
Site list:
${text}`;
      const v = await sample.json(prompt, {modelTier:"quick"});
      if (v && Array.isArray(v.sites) && v.sites.length) {
        return {by:"Claude", client:String(v.client || ""), assumptions:(v.assumptions || []).map(String),
          sites:v.sites.map(s => ({name:String(s.name || "Site"), bins:Math.max(0, parseInt(s.bins) || 0), locks:Math.max(0, parseInt(s.locks) || 0), sensors:Math.max(0, parseInt(s.sensors) || 0)}))};
      }
    } catch (e) { /* fall through to the built-in reader */ }
  }
  return Object.assign({by:"Built-in reader"}, parseLocal(text));
}

/* ---------- quoting and checks ---------- */
function price(sites, install){
  const locks = sites.reduce((a, s) => a + s.locks, 0), sensors = sites.reduce((a, s) => a + s.sensors, 0), bins = sites.reduce((a, s) => a + s.bins, 0);
  const visits = sites.reduce((a, s) => a + Math.max(s.locks, s.sensors), 0); // one visit per bin fitted; lock and sensor together count once
  const lines = [];
  if (locks) lines.push({label:"GravityLock", qty:locks, unit:PRICE.lock, note:"sample price"});
  if (sensors) lines.push({label:"Fill sensor", qty:sensors, unit:PRICE.sensor, note:"sample price"});
  if (install && visits) lines.push({label:"Installation", qty:visits, unit:PRICE.install, note:"per bin, lock and sensor in one visit"});
  if (sensors >= RULES.onboardingFrom) lines.push({label:"Reseller onboarding", qty:1, unit:PRICE.onboarding, note:"5 sensors and above"});
  const sub = lines.reduce((a, l) => a + l.qty * l.unit, 0);
  const rate = T().rate || 0, tax = sub * rate;
  return {locks, sensors, bins, lines, sub, tax, total:sub + tax};
}
function buildDraft(read, opts){
  const r = R(), sites = read.sites.map(s => Object.assign({}, s)), flags = read.assumptions.slice(), left = [];
  let q = price(sites, opts.install);
  if (opts.budget && q.total > opts.budget) {
    for (let i = sites.length - 1; i >= 0 && q.total > opts.budget; i--) {
      if (sites[i].sensors) { left.push(`${sites[i].sensors} sensors at ${sites[i].name}`); sites[i].sensors = 0; q = price(sites, opts.install); }
    }
    if (q.total > opts.budget) flags.push(`Still ${money(q.total - opts.budget)} over budget after removing sensors. Locks were kept; this needs your call.`);
  }
  if (q.locks && q.locks < RULES.starter) flags.push(`Only ${q.locks} locks: the five-lock starter pack is the smallest purchase.`);
  else if (q.locks && q.locks < RULES.minimum) flags.push(`${q.locks} locks is under the 25-lock customer minimum, so this goes out on starter-pack terms.`);
  if (opts.install && q.sensors && q.locks) flags.push("Installation is $45 per bin, assuming each sensor goes on a bin that is also getting a lock. A ThinkLid fitted in the same visit adds nothing; a later visit is $45.");
  const plan = q.bins > RULES.opsBreak ? {name:"Operations", fee:PRICE.opsLarge, why:`${q.bins} bins, above 250`} : {name:"Operations", fee:PRICE.opsSmall, why:`${q.bins} bins, up to 250`};
  const map = q.locks >= RULES.starter ? "Bin Map is free with 5 or more locks." : "Bin Map is not earned until 5 locks are purchased.";
  const client = (opts.client || read.client || "New client").trim();
  const existing = S.clients.some(c => c.rid === r.id && c.name.toLowerCase() === client.toLowerCase());
  const stock = ["lock","sensor"].map(k => { const need = k === "lock" ? q.locks : q.sensors, a = avail(k); return {k, need, a, ok:need <= a, eta:S.stock[k].eta}; }).filter(x => x.need);
  // Jev decisions, simulated by rules for this prototype
  const devices = q.locks + q.sensors, ratio = devices / r.typical;
  const dup = S.orders.some(o => o.rid === r.id && o.status < 5 && o.status >= 0 && o.client.toLowerCase() === client.toLowerCase() && o.locks === q.locks && o.sensors === q.sensors);
  const pn = dup ? 0.12 : clamp(1 - Math.abs(Math.log2(ratio || 0.01)) * 0.09, 0.4, 0.99);
  const sanity = dup ? {label:"Likely duplicate", p:0.88, ok:false} : {label: pn >= JEV[2].th ? "Normal" : "Unusual size for this reseller", p:pn, ok:pn >= JEV[2].th};
  const why = [];
  if (r.paused) why.push("Agent actions are paused for this reseller");
  if (r.level < 3) why.push(`Autonomy is level ${r.level} (${LEVELS[r.level]})`);
  if (!existing) why.push("First order for a new client always needs a person");
  if (devices > r.capOrder) why.push(`${devices} devices is over the ${r.capOrder}-device order cap`);
  if (!sanity.ok) why.push("The sanity check did not pass as normal");
  if (stock.some(x => !x.ok)) why.push("Stock is short, so delivery dates need your agreement");
  const act = why.length === 0;
  return {client, existing, sites, q, flags, left, plan, map, stock, sanity, gate:{act, why, p: act ? 0.98 : 0.99}, by:read.by, install:opts.install, budget:opts.budget};
}
function placeOrder(d, by){
  const id = "T-" + (S.seq++), r = R();
  S.orders.unshift({id, rid:r.id, client:d.client, locks:d.q.locks, sensors:d.q.sensors, total:d.q.total, status:1, by, t:new Date(), undo: by.startsWith("Agent")});
  [["lock", d.q.locks],["sensor", d.q.sensors]].forEach(([k, n]) => { if (n) { S.stock[k].reserved += n; S.moves.unshift({t:new Date(), item:k, qty:n, why:"Reserved, order " + id, who:"Agent", res:true}); } });
  if (!d.existing) S.clients.push({rid:r.id, name:d.client, bins:d.q.bins, locks:0, sensors:0, plan:d.plan.name});
  if (d.install) S.bookings.unshift({id:"B-" + (300 + S.seq), rid:r.id, client:d.client, type:"Install", when:day(9), crew:"Crew North", devices:d.q.locks + d.q.sensors, status:"Proposed", order:id});
  if (d.q.sensors >= RULES.onboardingFrom) S.bookings.unshift({id:"B-" + (400 + S.seq), rid:r.id, client:d.client, type:"Onboarding", when:day(11), crew:"Matter support", devices:0, status:"Proposed", order:id});
  log("Jev", `Order ${id} sanity check: ${d.sanity.label.toLowerCase()}`, d.sanity.p);
  log("Jev", `Autonomy gate for ${id}: ${d.gate.act ? "act" : "ask reseller"}`, d.gate.p);
  log(by.startsWith("Agent") ? "Claude" : "Person", `${by.startsWith("Agent") ? "Placed" : r.name + " approved"} order ${id} for ${d.client}; stock reserved and bookings proposed`);
  return id;
}

    <div class="log">${S.log.map(l => `<div><time>${fmtDate(l.t)}</time><span class="who ${l.who.toLowerCase()}">${l.who}</span><span>${esc(l.text)}${l.p != null ? ` <span class="num muted">(${pct(l.p)})</span>` : ""}</span></div>`).join("")}</div>
  </section>`;
}
function refCalc(){
  const rf = S.refer[S.rid]; let used = 0;
  const rows = rf.list.map(x => {
    const counted = x.stage === "lapsed" || x.stage === "signed" ? 0 : Math.max(0, Math.min(x.devices, REF.perCustomer, REF.perYear - used));
    used += counted;
    return Object.assign({}, x, {counted, reward: counted * REF.rates[x.plan], src:x});
  });
  return {rf, rows, used, earned: rows.filter(r => r.stage === "paid").reduce((a, r) => a + r.reward, 0), pending: rows.filter(r => r.stage === "potential").reduce((a, r) => a + r.reward, 0)};
}
function vRefer(){
  const r = R(), c = refCalc(), n = k => c.rows.filter(x => x.stage === k).length;
  return `<section class="panel"><div class="head"><h2>Referral program</h2><span class="pill warn">Placeholder reward amounts</span></div>
    <p>Refer a business that is new to ThinkOS. When it has been a paying customer for ${REF.payAfter} days, you earn a one-time reward for each of its active devices.</p>
    <div class="grid">
      <div class="tile"><span class="muted small">Signed up</span><b>${n("signed")}</b></div>
      <div class="tile"><span class="muted small">Potential paid</span><b>${n("potential")}</b><span class="small muted">${money(c.pending)} if they reach ${REF.payAfter} days</span></div>
      <div class="tile"><span class="muted small">Paid referrals</span><b>${n("paid")}</b></div>
      <div class="tile"><span class="muted small">Earned</span><b>${money(c.earned)}</b><span class="small muted">${c.rf.bank ? "Paid monthly to your bank account" : "Add bank details to be paid"}</span></div>
    </div>
    <div class="row"><span class="small">Devices counted this year</span><div class="meter"><i style="width:${pct(clamp(c.used / REF.perYear, 0, 1))}"></i></div><span class="num small">${c.used} of ${REF.perYear}</span></div>
    ${c.used >= REF.perYear ? `<div class="item warn"><span class="small">You have reached this year's limit. Referrers above ${REF.perYear} devices a year can apply to the Reseller Program.</span></div>` : ""}
  </section>
  <div class="two">
  <section class="panel"><h3>Your referral code and promotion codes</h3>
    <div class="item acc"><div class="row"><b class="num">${c.rf.code}</b><span class="grow"></span><button class="btn ghost" data-act="copy" data-v="${c.rf.code}">Copy code</button></div><span class="small muted">The referred business must sign up with this code. A referral cannot be traced back to you afterwards. The sign-up link is issued at launch.</span></div>
    <span class="small">Promotion codes give the referred business ${REF.promo}% off its dashboard subscription for the first year. Each code works for one customer.</span>
    <div class="row">${c.rf.promos.map(x => `<span class="pill num">${x}</span>`).join("")}</div>
    ${c.rf.bank ? "" : `<div class="item warn"><b>Bank details needed</b><span class="small">Add them now so a reward can be paid as soon as a referral qualifies.</span><div class="row"><button class="btn" data-act="bank">Mark bank details as added</button></div></div>`}
  </section>
  <section class="panel"><h3>Reward for each active device</h3>
    <div class="scroll"><table><thead><tr><th>Customer's plan</th><th class="r">Per device</th><th class="r">Most each</th></tr></thead><tbody>
    ${Object.keys(REF.rates).map(k => `<tr><td>${k}</td><td class="r num">${money(REF.rates[k])}</td><td class="r num">${money(REF.rates[k] * REF.perCustomer)}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted">Rewards cover a referred customer's first ${REF.perCustomer} devices, and up to ${REF.perYear} devices a calendar year. To count, the customer must sign up with your code, buy at least the five-lock starter pack within ${REF.buyWithin} days, and pay in full for ${REF.payAfter} days.</p>
  </section></div>
  <section class="panel"><div class="head"><h3>Your referrals</h3><button class="btn ghost" data-act="refadd">Add a sample referral</button></div>
    ${c.rows.map((x, i) => `<div class="item ${RSTAGE[x.stage][1]}"><div class="row"><b>${esc(x.name)}</b><span class="grow"></span><span class="pill ${RSTAGE[x.stage][1]}">${RSTAGE[x.stage][0]}</span></div>
      <span class="small muted">${x.stage === "signed" ? `Signed up ${x.days} days ago. No purchase yet; the starter pack must be bought by day ${REF.buyWithin}.` : x.stage === "lapsed" ? `No purchase within ${REF.buyWithin} days, so this referral does not count.` : `${x.plan}, ${x.devices} active devices, paying for ${x.days} days. ${x.counted} devices count: ${money(x.reward)}${x.stage === "paid" ? " earned" : " at day " + REF.payAfter}.`}</span>
      ${x.stage === "paid" || x.stage === "lapsed" ? "" : `<div class="row"><button class="btn ghost" data-act="refnext" data-i="${i}">Move forward 30 days</button></div>`}</div>`).join("")}
    <p class="small muted">Status emails will show the same three counts: signed up, potential paid and paid.</p>
  </section>`;
}
const RENDER = {refer:vRefer, brief:vBrief, order:vOrder, orders:vOrders, stock:vStock, bookings:vBookings, predict:vPredict, loyalty:vLoyalty, controls:vControls};

function render(){
  $("#tabs").innerHTML = VIEWS.map(([k, n]) => `<a href="#${k}" ${k === S.view ? 'aria-current="page"' : ""}>${n}</a>`).join("");
  const sel = $("#reseller");
  sel.innerHTML = Object.values(S.resellers).map(r => `<option value="${r.id}" ${r.id === S.rid ? "selected" : ""}>${esc(r.name)} (${TERR[r.terr].name})</option>`).join("");
  $("#app").innerHTML = RENDER[S.view]();
}
function route(){ const h = location.hash.replace("#", ""); S.view = RENDER[h] ? h : "brief"; render(); }
function keepForm(){
  const l = $("#list"); if (!l) return;
  S.listText = l.value; S.clientText = $("#client").value; S.budgetText = $("#budget").value; S.installOff = $("#install").value === "0";
}

/* ---------- actions ---------- */
async function build(){
  keepForm();
  const text = (S.listText == null ? SAMPLE_LIST : S.listText).trim();
  if (!text) { toast("Paste a site list first."); return; }
  S.busy = true; S.draft = null; S.step = 0; render();
  let read;
  try { read = await readList(text); } catch (e) { read = Object.assign({by:"Built-in reader"}, parseLocal(text)); }
  if (!read.sites.length) { S.busy = false; render(); toast("No sites with bin or device counts were found in that list."); return; }
  for (let i = 1; i <= 6; i++) { S.step = i; render(); await new Promise(r => setTimeout(r, 260)); }
  S.draft = buildDraft(read, {client:S.clientText, budget:parseFloat(S.budgetText) || 0, install:!S.installOff});
  S.busy = false; render();
}
async function ask(text){
  S.chat.push({me:true, text}); S.chatBusy = true; render();
  const rid = S.rid, r = R();
  const tools = [
    {name:"list_orders", description:"List this reseller's orders with status, quantities and totals", execute:() => mine(S.orders).map(o => ({id:o.id, client:o.client, locks:o.locks, sensors:o.sensors, total:o.total, status:o.status < 0 ? "Cancelled" : STATUS[o.status], placedBy:o.by}))},
    {name:"get_stock", description:"Get warehouse stock for locks and sensors: on hand, reserved, available, incoming and arrival date", execute:() => Object.keys(S.stock).map(k => ({product:S.stock[k].name, onHand:S.stock[k].onHand, reserved:S.stock[k].reserved, available:avail(k), incoming:S.stock[k].incoming, lands:fmtDate(S.stock[k].eta)}))},
    {name:"list_bookings", description:"List this reseller's install and onboarding bookings", execute:() => mine(S.bookings).map(b => ({client:b.client, type:b.type, when:fmtDate(b.when), crew:b.crew, devices:b.devices, status:b.status, order:b.order}))},
    {name:"list_clients", description:"List this reseller's clients with bins, devices and dashboard plan", execute:() => mine(S.clients).map(c => ({name:c.name, bins:c.bins, locks:c.locks, sensors:c.sensors, plan:c.plan}))}
  ];
  try {
    const res = await sample(`You are the ThinkOS reseller agent for ${r.name}, a reseller of GravityLock bin locks and fill sensors. Answer the reseller's question in at most four short sentences, using the tools for facts. This is sample data in a prototype. You cannot change anything from this chat; if asked to, say the change must be made on the New order or Orders tab. Question: ${text}`, {tools, cache:false, modelTier:"quick"});
    if (rid === S.rid) S.chat.push({text:res.text || "No answer came back."});
  } catch (e) {
    S.chat.push({text: e && e.code === "rate_limited" ? "Claude is busy. Try again in a minute." : "The agent could not answer just now."});
  }
  S.chatBusy = false; render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, r = R();
  if (act === "build") return void build();
  if (act === "discard") { S.draft = null; render(); return; }
  if (act === "approve" || act === "auto") {
    const id = placeOrder(S.draft, act === "auto" ? "Agent, within limits" : "Reseller"); S.draft = null; if (act === "approve") r.clean++;
    location.hash = "orders"; toast(`Order ${id} placed. Stock is reserved and bookings are proposed.`); return;
  }
  if (act === "next") {
    const o = S.orders.find(x => x.id === b.dataset.id); o.status++; o.undo = false;
    if (o.status === 3) [["lock", o.locks],["sensor", o.sensors]].forEach(([k, n]) => { if (n) { S.stock[k].onHand -= n; S.stock[k].reserved = Math.max(0, S.stock[k].reserved - n); S.moves.unshift({t:new Date(), item:k, qty:-n, why:"Shipped, order " + o.id, who:"Agent"}); } });
    if (o.status === 5) { r.active += o.locks + o.sensors; const c = S.clients.find(c => c.rid === o.rid && c.name === o.client); if (c) { c.locks += o.locks; c.sensors += o.sensors; } }
    log("Claude", `Order ${o.id} moved to ${STATUS[o.status]}`); render(); return;
  }
  if (act === "undo") {
    const o = S.orders.find(x => x.id === b.dataset.id); o.status = -1;
    [["lock", o.locks],["sensor", o.sensors]].forEach(([k, n]) => { if (n) { S.stock[k].reserved = Math.max(0, S.stock[k].reserved - n); S.moves.unshift({t:new Date(), item:k, qty:-n, why:"Released, order " + o.id + " undone", who:r.name, res:true}); } });
    S.bookings = S.bookings.filter(x => x.order !== o.id);
    log("Person", `${r.name} undid agent order ${o.id}; stock released and bookings removed`); render(); toast("Order undone and stock released."); return;
  }
  if (act === "confirm") { const k = S.bookings.find(x => x.id === b.dataset.id); k.status = "Confirmed"; log("Person", `${r.name} confirmed ${k.type.toLowerCase()} ${k.id} for ${k.client}`); render(); return; }
  if (act === "rebook") {
    const k = S.bookings.find(x => x.id === b.dataset.id), old = fmtDate(k.when); k.when = new Date(k.when.getTime() + 2 * 864e5); if (k.when.getDay() === 0) k.when = new Date(k.when.getTime() + 864e5); if (k.when.getDay() === 6) k.when = new Date(k.when.getTime() + 2 * 864e5);
    k.moved = "was " + old; log("Claude", `Moved ${k.type.toLowerCase()} ${k.id} for ${k.client} from ${old} to ${fmtDate(k.when)} and told the installer and client contact`); render(); toast("Booking moved to " + fmtDate(k.when) + "."); return;
  }
  if (act === "prep") { const p = S.predict[+b.dataset.i]; p.done = true; log("Claude", `Prepared: ${p.act.toLowerCase()} (${p.title})`, p.p); render(); return; }
  if (act === "copy") { const v = b.dataset.v; try { navigator.clipboard.writeText(v).then(() => toast("Copied " + v), () => toast("Copy was blocked. The code is " + v)); } catch (e) { toast("Copy was blocked. The code is " + v); } return; }
  if (act === "bank") { S.refer[S.rid].bank = true; log("Person", `${r.name} added bank details for referral rewards`); render(); return; }
  if (act === "refadd") { const names = ["Fernhill Community Centre","Saltbush Brewery","Glenmore Sports Club","Riverbend Distribution"]; const L = S.refer[S.rid].list; L.push({name:names[L.length % names.length], plan:"Operations", devices:0, stage:"signed", days:0}); render(); return; }
  if (act === "refnext") {
    const x = S.refer[S.rid].list[+b.dataset.i]; x.days += 30;
    if (x.stage === "signed") { x.stage = "potential"; x.devices = 25; x.days = 30; }
    if (x.stage === "potential" && x.days >= REF.payAfter) { x.stage = "paid"; log("Rule", `Referral ${x.name} reached ${REF.payAfter} paid days; reward queued for the next monthly payment`); }
    render(); return;
  }
  if (act === "pause") { r.paused = !r.paused; log("Person", `${r.name} ${r.paused ? "paused" : "resumed"} all agent actions`); render(); return; }
  if (act === "human") { log("Person", `${r.name} asked Matter support to take over${S.draft ? " the draft for " + S.draft.client : ""}`); render(); toast("Recorded. In the live system this opens a support hand-off."); return; }
});
document.addEventListener("change", e => {
  const id = e.target.id, r = R();
  if (id === "reseller") { S.rid = e.target.value; S.draft = null; S.chat = []; render(); }
  if (id === "level") { r.level = +e.target.value; log("Person", `${r.name} set autonomy to level ${r.level}`); render(); }
  if (id === "capOrder") { r.capOrder = Math.max(0, +e.target.value || 0); log("Person", `${r.name} set the order cap to ${r.capOrder} devices`); }
  if (id === "capClient") { r.capClient = Math.max(0, +e.target.value || 0); }
});
document.addEventListener("input", e => { if (["list","client","budget","install"].includes(e.target.id)) keepForm(); });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "askForm" && sample && !S.chatBusy) { const v = $("#ask").value.trim(); if (v) ask(v); }
});
window.addEventListener("hashchange", () => { keepForm(); route(); });
route();
</script>
</body>
</html>
